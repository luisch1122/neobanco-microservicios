name: CI/CD Pipeline - MS Auth Users

on:
  # 1. Al hacer merge/push a main -> DESPLIEGA EN LA VM
  push:
    branches: [ "main" ]
    paths:
      - 'ms-auth-users/**'

  # 2. Solo al ABRIR o ACTUALIZAR un Pull Request hacia main -> VERIFICA COMPILACIÓN
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ms-auth-users/**'

jobs:
  # JOB 1: Solo se ejecuta cuando abres un Pull Request (cuando ya terminaste la feature)
  test-and-verify:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: ☕ Configurar Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Verificar que compila antes de unir a main
        working-directory: ./ms-auth-users
        run: bash mvnw -B clean test

  # JOB 2: Solo se ejecuta al hacer merge a 'main'
  deploy-to-vm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: ☕ Configurar Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: 🔨 Compilar y Desplegar Contenedor
        working-directory: ./ms-auth-users
        env:
          JAVA_HOME: ""
        run: |
          java -version
          bash mvnw -B clean package -DskipTests
          docker build -t ms-auth-users:latest .
          docker stop auth-container || true
          docker rm auth-container || true
          docker run -d \
            --name auth-container \
            -p 8081:8080 \
            --restart unless-stopped \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            ms-auth-users:latest