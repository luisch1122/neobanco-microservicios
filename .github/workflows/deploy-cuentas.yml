name: CI/CD Pipeline - MS Cuentas

on:
  # 1. Al hacer merge/push a main -> DESPLIEGA EN LA VM
  push:
    branches: [ "main" ]
    paths:
      - 'ms-cuentas/**'
      - 'common-security/**'

  # 2. Solo al ABRIR o ACTUALIZAR un Pull Request hacia main -> VERIFICA COMPILACIÓN
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ms-cuentas/**'
      - 'common-security/**'

permissions:
  contents: read
  packages: read

jobs:
  # JOB 1: Solo se ejecuta cuando abres un Pull Request (cuando ya terminaste la feature)
  # Corre en ubuntu-latest (NO self-hosted): este job ejecuta código de
  # cualquier PR, incluyendo forks externos, por lo que no debe tener
  # acceso a la red interna (vm-data, vm-gateway).
  test-and-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: ☕ Configurar Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}

      - name: 🧪 Verificar que compila antes de unir a main
        working-directory: ./ms-cuentas
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash mvnw -B clean test

  # JOB 2: Solo se ejecuta al hacer merge a 'main'
  # Corre en self-hosted porque necesita red hacia vm-data/vm-backend,
  # pero solo se dispara con push a main (rama protegida, no PRs).
  deploy-to-vm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ☕ Configurar Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}

      - name: 🔨 Compilar y Desplegar Contenedor
        working-directory: ./ms-cuentas
        env:
          JAVA_HOME: ""
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          java -version
          docker buildx build --load \
            --secret id=maven_settings,src="$HOME/.m2/settings.xml" \
            --secret id=github_token,env=GITHUB_TOKEN \
            --secret id=github_actor,env=GITHUB_ACTOR \
            -t ms-cuentas:latest .
          docker stop cuentas-container || true
          docker rm cuentas-container || true
          docker run -d \
            --name cuentas-container \
            -p 8082:8080 \
            --restart unless-stopped \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            ms-cuentas:latest
