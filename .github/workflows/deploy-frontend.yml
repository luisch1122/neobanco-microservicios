name: CI/CD Pipeline - Frontend

on:
  # 1. Al abrir o actualizar un Pull Request hacia main -> VERIFICA BUILD Y TESTS
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

  # 2. Al hacer merge/push a main -> se re-verifica y se despliega el
  #    build de produccion a vm-gateway (job deploy-to-gateway).
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

jobs:
  test-and-verify:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        # Angular 22 + npm 10.9.8 tiene un bug conocido de resolucion de
        # peer deps (vitest/@vitejs/devtools) que rompe "npm ci" normal.
        run: npm ci --legacy-peer-deps

      - name: 🧪 Ejecutar tests unitarios
        run: npm test -- --watch=false

      - name: 🔨 Verificar build de producción
        run: npm run build

  # JOB de despliegue: copia el build de produccion del frontend hacia
  # vm-gateway y recarga Nginx. Requiere el secreto PRIVATE_KEY (clave
  # SSH privada) configurado en el repositorio.
  deploy-to-gateway:
    needs: test-and-verify
    if: github.event_name == 'push'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./frontend
    env:
      GATEWAY_HOST: 192.168.56.10
      GATEWAY_USER: vagrant
      GATEWAY_TARGET_DIR: /var/www/neobanco/frontend
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: 🔨 Build de producción
        run: npm run build -- --configuration production

      - name: 🚀 Copiar build a vm-gateway
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.GATEWAY_HOST }}
          username: ${{ env.GATEWAY_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          source: "frontend/dist/frontend/browser/*"
          target: ${{ env.GATEWAY_TARGET_DIR }}
          strip_components: 4
          overwrite: true

      - name: 🔄 Recargar Nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.GATEWAY_HOST }}
          username: ${{ env.GATEWAY_USER }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: sudo nginx -t && sudo systemctl reload nginx
