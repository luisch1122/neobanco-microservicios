name: CI/CD Pipeline - Frontend

on:
  # 1. Al abrir o actualizar un Pull Request hacia main -> VERIFICA BUILD Y TESTS
  pull_request:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

  # 2. Al hacer merge/push a main -> por ahora solo se re-verifica.
  #    El despliegue a vm-gateway (Nginx) se agregará cuando se
  #    configure el acceso SSH desde el runner de vm-backend.
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/**'

jobs:
  test-and-verify:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v5

      - name: 🟢 Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        # Angular 22 + npm 10.9.8 tiene un bug conocido de resolucion de
        # peer deps (vitest/@vitejs/devtools) que rompe "npm ci" normal.
        run: npm ci --legacy-peer-deps

      - name: 🧪 Ejecutar tests unitarios
        run: npm test -- --watch=false

      - name: 🔨 Verificar build de producción
        run: npm run build

  # JOB futuro (aun no habilitado): deploy-to-gateway
  # Pendiente: configurar clave SSH desde el runner self-hosted de
  # vm-backend hacia vm-gateway para copiar dist/frontend via scp/rsync
  # al directorio servido por Nginx.
