openapi: 3.0.3
info:
  title: NeoBanco - MS Auth & Usuarios
  description: >
    Contrato REST del microservicio de autenticación y gestión de usuarios.
    Expone el registro de usuarios y el inicio de sesión (login) que emite
    un token JWT para las peticiones posteriores.
  version: 0.1.0
  contact:
    name: NeoBanco Microservicios
servers:
  - url: http://localhost:8081
    description: Instancia local del microservicio
  - url: https://192.168.56.10/api/auth
    description: A través del API Gateway (Nginx) en la VM de edge

tags:
  - name: Auth
    description: Registro, autenticación y emisión de tokens

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un nuevo usuario
      description: >
        Crea un usuario nuevo. La contraseña recibida en texto plano se
        almacena únicamente como hash (BCrypt).
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
            examples:
              default:
                value:
                  nombre: "Ana Pérez"
                  email: "ana.perez@example.com"
                  password: "Sup3rSecreta!"
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Error de validación en los campos enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                default:
                  value:
                    email: "El campo email debe ser un correo válido"
                    nombre: "El campo nombre no debe estar vacío"
        '409':
          description: Ya existe un usuario registrado con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: >
        Valida las credenciales del usuario y, si son correctas, devuelve
        un token JWT que debe enviarse como `Authorization: Bearer <token>`
        en las peticiones a los demás microservicios.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  email: "ana.perez@example.com"
                  password: "Sup3rSecreta!"
      responses:
        '200':
          description: Autenticación exitosa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Error de validación en los campos enviados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                default:
                  value:
                    mensaje: "Credenciales inválidas"

components:
  schemas:
    UserRegisterRequest:
      type: object
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
          example: "Ana Pérez"
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          example: "ana.perez@example.com"
          maxLength: 100
        password:
          type: string
          format: password
          example: "Sup3rSecreta!"
          minLength: 8
          description: Contraseña en texto plano; el servicio la almacena como hash BCrypt.

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Ana Pérez"
        email:
          type: string
          example: "ana.perez@example.com"
        estado:
          type: string
          enum: [ACTIVO, INACTIVO, BLOQUEADO]
          example: "ACTIVO"
        creadoEn:
          type: string
          format: date-time
          example: "2026-08-28T10:15:30"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "ana.perez@example.com"
        password:
          type: string
          format: password
          example: "Sup3rSecreta!"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT firmado
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhbmEucGVyZXpAZXhhbXBsZS5jb20ifQ.xxxx"
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          format: int64
          description: Tiempo de expiración del token en segundos
          example: 3600

    ValidationErrorResponse:
      type: object
      description: Mapa de errores de validación, clave = nombre del campo, valor = mensaje
      additionalProperties:
        type: string

    ErrorResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Credenciales inválidas"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
