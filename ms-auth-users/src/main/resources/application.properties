# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
server.port=${SERVER_PORT:8080}
spring.application.name=ms-auth-users

# ==========================================
# CONEXIÓN A LA BASE DE DATOS (VM 3)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://192.168.56.30:5432/db_auth}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIBERNATE (ORM)
# ==========================================
# 'update' creará las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none