# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
server.port=8080
spring.application.name=ms-auth-users

# ==========================================
# CONEXIÓN A LA BASE DE DATOS (VM 3)
# ==========================================
spring.datasource.url=jdbc:postgresql://192.168.56.30:5432/db_auth
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIBERNATE (ORM)
# ==========================================
# 'update' creará las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true