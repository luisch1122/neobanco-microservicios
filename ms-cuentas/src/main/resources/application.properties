# ==========================================
server.port=${SERVER_PORT:8080}
spring.application.name=ms-cuentas

# ==========================================
# JWT
# ==========================================
# Clave HS256 en Base64 (32+ bytes). En produccion se sobreescribe con
# la variable de entorno JWT_SECRET (ver .github/workflows/deploy-auth.yml).
# El valor por defecto es solo para desarrollo local, NUNCA usar en produccion.
jwt.secret=${JWT_SECRET:ebd1AAa7BqMlMT8tU6JnPz797gKi3CN3zYDHrUvNiNk=}

# ==========================================
# CONEXIÓN A LA BASE DE DATOS (VM 3)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://192.168.56.30:5432/db_account}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# HIBERNATE (ORM)
# ==========================================
# 'update' creará las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none