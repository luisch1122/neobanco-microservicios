# ==========================================
# CONFIGURACION DE TEST
# ==========================================
server.port=0
spring.application.name=ms-transacciones-test

# Clave fija de pruebas (no usar en produccion). Debe coincidir con la
# usada por ms-auth-users/ms-cuentas para validar tokens emitidos en pruebas.
jwt.secret=l1W05rqSYG+Il1y9j90yRwHGdVq7PNJ6qB/JerDh1V0=

# No se realizan llamadas HTTP reales en los tests: AccountClient se
# reemplaza por un mock (@MockitoBean), por lo que esta URL nunca se usa.
ms-cuentas.base-url=http://localhost:0

# ==========================================
# BASE DE DATOS EN MEMORIA
# ==========================================
spring.datasource.url=jdbc:h2:mem:transacciones_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==========================================
# HIBERNATE (ORM)
# ==========================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
