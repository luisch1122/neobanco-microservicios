# Configuración de Nginx para vm-gateway (192.168.56.10)
#
# Sirve los estáticos del frontend Angular y hace de reverse proxy
# hacia los microservicios backend en vm-backend (192.168.56.20).
#
# Instalación en vm-gateway:
#   sudo apt update && sudo apt install -y nginx
#   sudo cp neobanco.conf /etc/nginx/sites-available/neobanco.conf
#   sudo ln -s /etc/nginx/sites-available/neobanco.conf /etc/nginx/sites-enabled/neobanco.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/neobanco/frontend
#   sudo nginx -t && sudo systemctl reload nginx
#
# El job "deploy-to-gateway" del workflow copia el contenido de
# frontend/dist/frontend/browser hacia /var/www/neobanco/frontend
# vía scp/rsync sobre SSH.

server {
    listen 80;
    server_name 192.168.56.10;

    # --- Frontend Angular (SPA) ---
    root /var/www/neobanco/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (main-XXXX.js, chunk-XXXX.js, etc.):
    # cache largo, ya que un cambio de contenido cambia el nombre.
    location ~* \.(?:js|css|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- API Gateway: ms-auth-users ---
    # El frontend llama a /api/... (ver environment.production.ts).
    # El proxy_pass con "/" al final reemplaza el prefijo "/api/" antes
    # de reenviar, por lo que /api/auth/login -> /auth/login en el
    # backend.
    location /api/ {
        proxy_pass http://192.168.56.20:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

