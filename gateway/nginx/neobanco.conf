# Configuración de Nginx para vm-gateway (192.168.56.10)
#
# Sirve los estáticos del frontend Angular y hace de reverse proxy
# hacia los microservicios backend en vm-backend (192.168.56.20).
#
# Instalación en vm-gateway:
#   sudo apt update && sudo apt install -y nginx
#   sudo cp neobanco.conf /etc/nginx/sites-available/neobanco.conf
#   sudo ln -s /etc/nginx/sites-available/neobanco.conf /etc/nginx/sites-enabled/neobanco.conf
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo mkdir -p /var/www/neobanco/frontend
#   sudo nginx -t && sudo systemctl reload nginx
#
# El job "deploy-to-gateway" del workflow copia el contenido de
# frontend/dist/frontend/browser hacia /var/www/neobanco/frontend
# vía scp/rsync sobre SSH.

server {
    listen 80;
    server_name 192.168.56.10;

    # --- Frontend Angular (SPA) ---
    root /var/www/neobanco/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (main-XXXX.js, chunk-XXXX.js, etc.):
    # cache largo, ya que un cambio de contenido cambia el nombre.
    location ~* \.(?:js|css|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- API Gateway: ms-auth-users ---
    # El frontend llama a /api/... (ver environment.production.ts).
    # El proxy_pass con "/" al final reemplaza el prefijo "/api/" antes
    # de reenviar, por lo que /api/auth/login -> /auth/login en el
    # backend. ms-auth-users publica el puerto 8081 en vm-backend
    # (docker run -p 8081:8080 en deploy-auth.yml); el resto de
    # microservicios usarán otros puertos (8082, 8083, ...).
    location /api/ {
        proxy_pass http://192.168.56.20:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --- API Gateway: ms-cuentas ---
    # Bloquea cualquier intento de acceder a rutas internas desde el
    # exterior (solo ms-transacciones, dentro de la red de vm-backend,
    # debe poder llamarlas directamente por IP:puerto, sin pasar por acá).
    location ~ ^/api/cuentas/internal/ {
        return 403;
    }

    location /api/cuentas/ {
        proxy_pass http://192.168.56.20:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API Gateway: ms-transacciones ---
    # ms-transacciones publica el puerto 8083 en vm-backend (docker run
    # -p 8083:8080 en deploy-transaction.yml). No tiene rutas internas
    # propias que bloquear: las llamadas internas van en sentido
    # contrario (ms-transacciones -> ms-cuentas), nunca hacia acá.
    location /api/transacciones/ {
        proxy_pass http://192.168.56.20:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

